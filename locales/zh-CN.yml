# utwget 简体中文翻译
---
_version: 1.0
utwget:
  # ===================
  # 版本信息
  # ===================
  version: "utwget 0.1.0 - Rust 重构版 GNU Wget 1.21.4"
  version_features: |
    -cares +digest -gpgme +https +ipv6 +iri +large-file -metalink +nls
    +ntlm +opie +psl +ssl/gnutls
  wgetrc_system: "Wgetrc:\n    /usr/local/etc/wgetrc (系统)\n"
  locale: "语区:\n    /usr/local/share/locale\n"

  # ===============
  # 帮助信息
  # ===============
  help_usage: "用法： utwget [选项]... [URL]..."
  help_mandatory: "长选项所必须的参数在使用短选项时也是必须的。"

  # 启动选项
  help_startup: "启动："
  help_version: "显示 Wget 的版本信息并退出"
  help_help: "打印此帮助"
  help_background: "启动后转入后台"
  help_execute: "运行一个\".wgetrc\"风格的命令"

  # 日志选项
  help_logging: "日志和输入文件："
  help_output_file: "将日志信息写入 FILE"
  help_append_output: "将信息添加至 FILE"
  help_debug: "打印大量调试信息"
  help_quiet: "安静模式 (无信息输出)"
  help_verbose: "详尽的输出 (此为默认值)"
  help_no_verbose: "关闭详尽输出，但不进入安静模式"
  help_report_speed: "以 <类型> 报告带宽。类型可以是 bits"
  help_input_file: "下载本地或外部 <文件> 中的 URL"
  help_force_html: "把输入文件当成 HTML 文件"
  help_base: "解析相对于 URL 的 HTML 输入文件链接 (-i -F)"
  help_config: "指定要使用的配置文件"
  help_no_config: "不读取任何配置文件"
  help_rejected_log: "将拒绝 URL 的原因写入 <文件>。"

  # 下载选项
  help_download: "下载："
  help_tries: "设置重试次数为 <数字> (0 代表无限制)"
  help_retry_connrefused: "即使拒绝连接也是重试"
  help_retry_on_host_error: "consider host errors as non-fatal, transient errors"
  help_retry_on_http_error: "提供以逗号分隔的列表，列出遇到时进行重试的 HTTP 错误"
  help_output_document: "将文档写入 FILE"
  help_no_clobber: "不要下载已存在将被覆盖的文件"
  help_continue: "断点续传下载文件"
  help_start_pos: "从由零计数的 <偏移量> 开始下载"
  help_progress: "选择进度条类型"
  help_show_progress: "在任意啰嗦状态下都显示进度条"
  help_timestamping: "只获取比本地文件新的文件"
  help_server_response: "打印服务器响应"
  help_spider: "不下载任何文件"
  help_timeout: "将所有超时设为 SECONDS 秒"
  help_wait: "等待间隔为 SECONDS 秒"
  help_no_proxy: "禁止使用代理"
  help_quota: "设置获取配额为 <数字> 字节"
  help_limit_rate: "限制下载速率为 RATE"

  # ===============
  # 错误信息
  # ===============
  error_no_url: "未指定 URL"
  error_file_not_found: "文件未找到: %{file}"
  error_connection_refused: "连接被拒绝"
  error_timeout: "连接超时"
  error_dns_failure: "DNS 解析失败: %{host}"
  error_invalid_url: "无效的 URL: %{url}"
  error_write_failed: "写入失败: %{reason}"
  error_read_failed: "读取失败: %{reason}"
  error_network: "网络错误: %{reason}"
  error_ssl: "SSL 错误: %{reason}"
  error_auth_failed: "认证失败"
  error_too_many_redirects: "重定向次数过多"

  # ===============
  # 警告信息
  # ===============
  warning_config_error: "警告: 应用 %{path} 时出错: %{error}"
  warning_config_read_error: "警告: 读取 %{path} 时出错: %{error}"
  warning_failed_set_xattr: "无法设置 %{path} 的扩展属性: %{error}"
  warning_failed_permissions: "无法设置 %{path} 的权限: %{error}"
  warning_partial_download: "警告: 部分下载已完成"

  # ===============
  # 状态信息
  # ===============
  status_saved: "已保存 [%{size} 字节]"
  status_saved_to: "已保存到: %{path}"
  status_download_complete: "下载完成"
  status_downloading: "正在下载"
  status_connecting: "正在连接 %{host}:%{port}"
  status_resolving: "正在解析 %{host}..."
  status_redirect: "重定向到 %{url}"
  status_not_modified: "服务器文件未修改"
  status_skipping: "跳过 %{url}: %{reason}"

  # ===============
  # 进度显示
  # ===============
  progress_finished: "完成 --"
  progress_downloaded: "已下载: %{bytes} 字节，共 %{files} 个文件"
  progress_time: "总用时: %{duration}"
  progress_speed: "速度: %{speed}"

  # ===============
  # 认证
  # ===============
  auth_password_prompt: "%{user} 的密码: "
  auth_password_prompt_default: "密码: "
  auth_username_prompt: "用户名: "

  # ===============
  # 递归下载
  # ===============
  recursive_entering: "进入目录 %{dir}"
  recursive_leaving: "离开目录 %{dir}"
  recursive_depth: "深度: %{depth}"
  recursive_following: "跟随 %{url} 中的链接"

  # ===============
  # 代理信息
  # ===============
  proxy_connecting: "正在连接代理 %{host}:%{port}"
  proxy_tunnel: "正在建立到 %{host}:%{port} 的隧道"

  # ===============
  # 断点续传
  # ===============
  resume_partial: "检测到部分下载，从字节 %{pos} 继续"
  resume_complete: "下载已完成"
