[package]
name = "ut-core"
version = "0.1.0"
edition = "2021"
description = "Core library for utwget: config, URL parsing, error types, cookies, HSTS, robots, filters"
license = "LGPL-3.0-or-later"

[features]
default = ["hsts", "compression", "idn"]
hsts = ["serde_json"]
compression = []
idn = ["dep:idna"]

[dependencies]
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
url = "=2.5.2"
idna = { version = "0.5", optional = true }
regex = "1"
chrono = "0.4"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
log = "0.4"
env_logger = "0.11"
serde_json = { version = "1", optional = true }
