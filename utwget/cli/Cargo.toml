[package]
name = "utwget-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "CLI entry point for utwget: argument parsing, wgetrc config, application orchestration"

[features]
default = ["metalink", "hsts", "compression", "http2", "auth-ntlm", "async"]
metalink = ["ut-metalink"]
hsts = ["ut-core/hsts"]
compression = ["ut-core/compression"]
http2 = ["ut-http/http2"]
auth-ntlm = ["ut-http/auth-ntlm"]
async = ["ut-retriever/async"]

[dependencies]
ut-core = { path = "../core" }
ut-http = { path = "../http" }
ut-retriever = { path = "../retriever" }
ut-progress = { path = "../progress" }
ut-html = { path = "../html" }
ut-metalink = { path = "../metalink", optional = true }
clap = { version = "=4.4.18", features = ["derive", "wrap_help"] }
env_logger = "0.11"
libc = "0.2"
log = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
num_cpus = "1"
