[package]
name = "ut-net"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Network layer for utwget: DNS, TCP, TLS, proxy, Transport trait"

[features]
default = ["tls-rustls"]
tls-rustls = ["dep:rustls", "dep:webpki-roots", "dep:rustls-pki-types", "dep:rustls-pemfile"]
tls-native = ["dep:native-tls"]

[dependencies]
ut-core = { path = "../core" }
rustls = { version = "0.23", optional = true }
webpki-roots = { version = "0.26", optional = true }
rustls-pki-types = { version = "1", optional = true }
rustls-pemfile = { version = "2", optional = true }
native-tls = { version = "0.2", optional = true }
libc = "0.2"
log = "0.4"
thiserror = "2"
