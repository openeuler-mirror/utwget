[package]
name = "ut-http"
version = "0.1.0"
edition = "2021"
description = "HTTP/1.1 protocol stack for utwget: request/response, auth, chunked encoding, compression"

[features]
default = ["compression", "auth-digest", "auth-ntlm", "http2"]
compression = ["dep:flate2"]
auth-digest = []
auth-ntlm = []
http2 = ["dep:h2", "dep:tokio", "dep:hyper-util", "dep:tokio-rustls", "dep:rustls", "dep:webpki-roots"]

[dependencies]
ut-core = { path = "../core" }
ut-net = { path = "../net" }
httparse = "1"
flate2 = { version = "1", optional = true }
chrono = "0.4"
base64 = "0.22"
log = "0.4"
bytes = "1"
http = "1"
h2 = { version = "0.4", optional = true }
tokio = { version = "1", features = ["net", "io-util", "time", "rt-multi-thread"], optional = true }
hyper-util = { version = "0.1", features = ["tokio", "http1", "http2"], optional = true }
tokio-rustls = { version = "0.26", optional = true }
rustls = { version = "0.23", optional = true }
webpki-roots = { version = "0.26", optional = true }
indexmap = { version = "=2.7.1", optional = true }
