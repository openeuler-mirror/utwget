[workspace]
resolver = "2"
members = [
    "utwget/core",
    "utwget/net",
    "utwget/http",
    "utwget/ftp",
    "utwget/html",
    "utwget/retriever",
    "utwget/warc",
    "utwget/metalink",
    "utwget/progress",
    "utwget/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.82.0"

[workspace.dependencies]
ut-core = { path = "utwget/core" }
ut-http = { path = "utwget/http", features = ["compression", "auth-digest"] }
ut-ftp = { path = "utwget/ftp" }
ut-html = { path = "utwget/html" }
ut-retriever = { path = "utwget/retriever" }
ut-warc = { path = "utwget/warc" }
ut-metalink = { path = "utwget/metalink" }
utwget-cli = { path = "utwget/cli" }
base64 = "0.22"
flate2 = "1"

# Pin dependencies that require edition2024 to older versions for Rust 1.82.0 compatibility
zeroize = "=1.8.1"
indexmap = "=2.7.1"

# 根级 crate，编译 utwget 二进制
[package]
name = "utwget"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = ["metalink", "hsts", "compression", "http2", "auth-ntlm", "async"]
metalink = ["ut-metalink"]
hsts = ["ut-core/hsts"]
compression = ["ut-core/compression"]
http2 = ["ut-http/http2", "ut-retriever/http2"]
auth-ntlm = ["ut-http/auth-ntlm"]
async = ["ut-retriever/async"]

[dependencies]
ut-core = { path = "utwget/core" }
ut-retriever = { path = "utwget/retriever" }
ut-progress = { path = "utwget/progress" }
ut-html = { path = "utwget/html" }
ut-metalink = { path = "utwget/metalink", optional = true }
clap = { version = "=4.4.18", features = ["derive", "wrap_help"] }
env_logger = "0.11"
libc = "0.2"
log = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
num_cpus = "1"

[[bin]]
name = "utwget"
path = "utwget/cli/src/main.rs"

[dev-dependencies]
ut-core.workspace = true
ut-http.workspace = true
ut-ftp.workspace = true
ut-html.workspace = true
ut-retriever.workspace = true
ut-warc.workspace = true
ut-metalink.workspace = true
utwget-cli.workspace = true
base64.workspace = true
flate2.workspace = true
chrono = "0.4"

[[test]]
name = "sync_basic_download"
path = "tests/sync/basic_download.rs"

[[test]]
name = "sync_recursive"
path = "tests/sync/recursive.rs"

